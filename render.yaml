# Render Blueprint — CaféPass Deployment
# https://render.com/docs/blueprint-spec

services:
  # Backend API
  - type: web
    name: cafepass-api
    env: node
    plan: starter
    region: frankfurt # Close to Uzbekistan
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: cafepass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false

  # Frontend (static site)
  - type: web
    name: cafepass-frontend
    env: static
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: cafepass-db
    plan: starter
    region: frankfurt
    databaseName: cafepass
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all (restrict in production)
